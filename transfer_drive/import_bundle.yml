---
# import_bundle.yml
# Survey-driven RHIS highside bundle delivery playbook.
# Runs on the operator's RHEL workstation from the root of the TRANSFER_DRV.
# Handles three delivery methods: usb, rsync, virtual_disk.
#
# Usage:
#   ./import_bundle.sh
#   ansible-playbook import_bundle.yml

- name: "RHIS Highside Bundle — Data Delivery"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:

    - name: delivery_method
      prompt: |2

        ══════════════════════════════════════════════════════════════════
         RHIS Highside Bundle Import
        ══════════════════════════════════════════════════════════════════

         Select delivery method:

           usb          — Drive physically connected to the satellite
           rsync        — Push from this workstation over the network
           virtual_disk — Push all content to provisioner first

        Delivery method [usb/rsync/virtual_disk]
      private: false

    - name: provisioner_host
      prompt: "Provisioner hostname or IP"
      private: false

    - name: satellite_host
      prompt: "Satellite hostname or IP"
      private: false

    - name: deployment
      prompt: "Deployment name (e.g. highside.example.ca)"
      private: false

    - name: ssh_user
      prompt: "SSH user"
      default: "ansiblerunner"
      private: false

    - name: ssh_key
      prompt: "SSH private key path"
      default: "~/.ssh/id_ed25519"
      private: false

  tasks:

    - name: "Validate delivery method"
      ansible.builtin.assert:
        that: delivery_method in ['usb', 'rsync', 'virtual_disk']
        fail_msg: >
          Invalid delivery method '{{ delivery_method }}'.
          Must be one of: usb, rsync, virtual_disk.
          See README_FIRST.md for a description of each method.

    - name: "Set drive root"
      ansible.builtin.set_fact:
        _drive_root: "{{ playbook_dir }}"

    # ── Read bundle manifest ──────────────────────────────────────────────────
    # rhis_export_manifest.yml at the drive root carries the Pulp export path,
    # from which we derive the org-level directory name (e.g. Default_Organization).
    # Required for rsync/virtual_disk methods to know which directory is Pulp content.

    - name: "Read bundle manifest from drive"
      ansible.builtin.slurp:
        src: "{{ _drive_root }}/rhis_export_manifest.yml"
      register: _manifest_slurp
      ignore_errors: true

    - name: "Parse bundle manifest"
      when: _manifest_slurp is not failed
      ansible.builtin.set_fact:
        _pulp_export_path: "{{ (_manifest_slurp.content | b64decode | from_yaml).pulp_export_path | default('') }}"
        _pulp_org_dir: "{{ ((_manifest_slurp.content | b64decode | from_yaml).pulp_export_path | default(''))
                           | regex_replace('^/var/lib/pulp/exports/([^/]+)/.*$', '\\1') }}"

    - name: "Warn if manifest not found"
      when: _manifest_slurp is failed
      ansible.builtin.debug:
        msg: >-
          WARNING: rhis_export_manifest.yml not found at {{ _drive_root }}.
          Pulp org directory cannot be determined — rsync/virtual_disk Pulp transfer will fail.
          Ensure the drive was prepared with transfer_to_drive.sh on the lowside.

    - name: "Assert Pulp org dir is known for network delivery"
      when: delivery_method in ['rsync', 'virtual_disk']
      ansible.builtin.assert:
        that:
          - _pulp_org_dir is defined
          - _pulp_org_dir | length > 0
          - _pulp_org_dir != _pulp_export_path
        fail_msg: >
          Pulp org directory could not be determined from rhis_export_manifest.yml.
          Ensure the drive was prepared with transfer_to_drive.sh and the manifest is present.

    - name: "Show delivery plan"
      ansible.builtin.debug:
        msg:
          - "══════════════════════════════════════════════════════════════════"
          - " Delivery plan"
          - "══════════════════════════════════════════════════════════════════"
          - "  Method:      {{ delivery_method }}"
          - "  Provisioner: {{ provisioner_host }}"
          - "  Satellite:   {{ satellite_host }}"
          - "  Deployment:  {{ deployment }}"
          - "  Pulp org:    {{ _pulp_org_dir | default('(not required for usb)') }}"
          - "══════════════════════════════════════════════════════════════════"

    # ── Preflight: provisioner disk space ────────────────────────────────────────
    # For rsync and virtual_disk, everything on the drive except the Pulp export
    # goes to ~/rhis_transfer on the provisioner.  Measure the transfer footprint
    # locally and assert the provisioner /home has room before starting the copy.

    - name: "Preflight — measure non-Pulp transfer size"
      when: delivery_method in ['rsync', 'virtual_disk']
      ansible.builtin.command:
        cmd: "du -sb --exclude='{{ _pulp_org_dir }}' {{ _drive_root }}/"
      register: _transfer_size_raw
      changed_when: false

    - name: "Preflight — check available space on provisioner /home"
      when: delivery_method in ['rsync', 'virtual_disk']
      ansible.builtin.command:
        cmd: >
          ssh -o StrictHostKeyChecking=no -i {{ ssh_key }}
          {{ ssh_user }}@{{ provisioner_host }}
          "df -B1 /home | awk 'NR==2{print $4}'"
      register: _prov_space_raw
      changed_when: false

    - name: "Preflight — assert provisioner has sufficient space"
      when: delivery_method in ['rsync', 'virtual_disk']
      ansible.builtin.assert:
        that:
          - _prov_space_raw.stdout | trim | int >= _transfer_size_raw.stdout.split()[0] | int
        fail_msg: >-
          Insufficient space on {{ provisioner_host }}:/home.
          Transfer requires ~{{ (_transfer_size_raw.stdout.split()[0] | int / 1073741824) | round(1) }} GB.
          Available: {{ (_prov_space_raw.stdout | trim | int / 1073741824) | round(1) }} GB.
          Expand /home on the provisioner before retrying.

    # ── USB ──────────────────────────────────────────────────────────────────────
    # No network transfer from workstation. Drive is physically connected to satellite.
    # The build script on the provisioner discovers and mounts the drive by label.

    - name: "Using USB — wait for physical drive connection"
      when: delivery_method == 'usb'
      ansible.builtin.pause:
        prompt: |

          USB delivery selected. No network transfer is required from this workstation.

          1. Physically connect this drive to the satellite ({{ satellite_host }})
          2. The drive label must be: TRANSFER_DRV
          3. Do NOT mount it manually — the build script will discover and mount it

          Press Enter when the drive is connected to the satellite

    # ── rsync ────────────────────────────────────────────────────────────────────
    # Pulp chunks go directly from workstation → satellite staging (large, single hop).
    # Non-Pulp C3 artifacts go from workstation → provisioner ~/rhis_transfer/.

    - name: "Running rsync — create Pulp staging path on satellite"
      when: delivery_method == 'rsync'
      ansible.builtin.command:
        cmd: >
          ssh -o StrictHostKeyChecking=no -i {{ ssh_key }}
          {{ ssh_user }}@{{ satellite_host }}
          "sudo mkdir -p /var/satellite_stage/pulp_stage/{{ _pulp_org_dir }} &&
           sudo chown {{ ssh_user }}:{{ ssh_user }} /var/satellite_stage/pulp_stage/{{ _pulp_org_dir }}"
      changed_when: true

    - name: "Running rsync — transfer Pulp content to satellite staging (large — please wait)..."
      when: delivery_method == 'rsync'
      ansible.builtin.command:
        cmd: >
          rsync -a --progress
          -e "ssh -o StrictHostKeyChecking=no -i {{ ssh_key }}"
          {{ _drive_root }}/{{ _pulp_org_dir }}/
          {{ ssh_user }}@{{ satellite_host }}:/var/satellite_stage/pulp_stage/{{ _pulp_org_dir }}/
      changed_when: true

    - name: "Running rsync — create artifact staging path on provisioner"
      when: delivery_method == 'rsync'
      ansible.builtin.command:
        cmd: >
          ssh -o StrictHostKeyChecking=no -i {{ ssh_key }}
          {{ ssh_user }}@{{ provisioner_host }}
          "mkdir -p /home/{{ ssh_user }}/rhis_transfer"
      changed_when: true

    - name: "Running rsync — transfer artifacts to provisioner staging..."
      when: delivery_method == 'rsync'
      ansible.builtin.command:
        cmd: >
          rsync -a --progress
          --exclude="{{ _pulp_org_dir }}/"
          --exclude="import_bundle.sh"
          --exclude="import_bundle.yml"
          --exclude="README_FIRST.md"
          --exclude="transfer_to_drive.sh"
          -e "ssh -o StrictHostKeyChecking=no -i {{ ssh_key }}"
          {{ _drive_root }}/
          {{ ssh_user }}@{{ provisioner_host }}:/home/{{ ssh_user }}/rhis_transfer/
      changed_when: true

    # ── virtual_disk ─────────────────────────────────────────────────────────────
    # All drive content pushed to provisioner. The provisioner delivers
    # everything (including Pulp) to the satellite during the build.

    - name: "Using virtual_disk — create staging path on provisioner"
      when: delivery_method == 'virtual_disk'
      ansible.builtin.command:
        cmd: >
          ssh -o StrictHostKeyChecking=no -i {{ ssh_key }}
          {{ ssh_user }}@{{ provisioner_host }}
          "mkdir -p /home/{{ ssh_user }}/rhis_transfer"
      changed_when: true

    - name: "Using virtual_disk — transfer all bundle content to provisioner (large — please wait)..."
      when: delivery_method == 'virtual_disk'
      ansible.builtin.command:
        cmd: >
          rsync -a --progress
          --exclude="import_bundle.sh"
          --exclude="import_bundle.yml"
          --exclude="README_FIRST.md"
          --exclude="transfer_to_drive.sh"
          -e "ssh -o StrictHostKeyChecking=no -i {{ ssh_key }}"
          {{ _drive_root }}/
          {{ ssh_user }}@{{ provisioner_host }}:/home/{{ ssh_user }}/rhis_transfer/
      changed_when: true

    # ── Next steps ───────────────────────────────────────────────────────────────

    - name: "Data delivery complete — next steps"
      ansible.builtin.debug:
        msg:
          - "══════════════════════════════════════════════════════════════════"
          - " Data delivery complete"
          - "══════════════════════════════════════════════════════════════════"
          - ""
          - " Step 1 — Prepare the provisioner (run from this workstation):"
          - ""
          - "   ssh {{ ssh_user }}@{{ provisioner_host }}"
          - ""
          - "   ~/rhis_transfer/prepare_highside.sh \\"
          - "     --deployment {{ deployment }} \\"
          - "     --idm-host idm1.{{ deployment }} \\"
          - "     --sat-host satellite1.{{ deployment }}"
          - ""
          - " This will load containers, place inventory, mount the RHEL and"
          - " Satellite DVD ISOs, start the local package HTTP server, and"
          - " distribute repo files to the IdM and Satellite hosts."
          - ""
          - " Step 2 — Build IdM (from inside the provisioner container):"
          - ""
          - "   build_idm_primary.sh \\"
          - "     --deployment {{ deployment }}"
          - ""
          - " Step 3 — Build Satellite (from inside the provisioner container):"
          - ""
          - "   build_sat_disconnected_import.sh \\"
          - "     --delivery-method {{ delivery_method }} \\"
          - "     --deployment {{ deployment }}"
          - ""
          - " The DVD HTTP server started by prepare_highside.sh must remain"
          - " running for the duration of Steps 2 and 3."
          - ""
          - " IMPORTANT: Ensure the vault password has been delivered via"
          - " a separate trusted channel before starting the builds."
          - "══════════════════════════════════════════════════════════════════"
