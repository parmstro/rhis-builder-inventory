  - name: "Microsoft SQL Server for Linux 2022 for RHEL 9"
    desc: "Microsoft SQL Server for Linux 2022 installation and tools"
    org: "{{ satellite_organization }}"
    label: "mssqlserver-2022-rhel-9"
    repositories:
      - name: "mssqlserver2022_rhel9"
        description: "MSSQL Server 2022 server installation packages"
        upstream_name: ""
        content_type: "yum"
        url: "https://packages.microsoft.com/rhel/9/mssql-server-2022/"
        username: ""
        password: ""
        download_policy: "immediate"
      - name: "msqltools2022_rhel9"
        description: "MSSQL Server 2022 tools and drivers packages"
        upstream_name: ""
        content_type: "yum"
        url: "https://packages.microsoft.com/rhel/9/prod/"
        username: ""
        password: ""
        download_policy: "immediate"

  - name: "Red Hat Enterprise Linux Bootc Containers"
    desc: "Red Hat containers from registry.redhat.io"
    org: "{{ satellite_organization }}"
    label: "rh_rhel9_bootc_containers"
    repositories:
      - name: "rhel9/rhel-bootc"
        label: "rhel9_rhel-bootc"
        description: "rhel9 bootc image mode container repo"
        docker_upstream_name: "rhel9/rhel-bootc"
        content_type: "docker"
        url: "https://registry.redhat.io"
        upstream_username: "{{ redhat_registry_username_vault }}"
        upstream_password: "{{ redhat_registry_password_vault }}"
        download_policy: "immediate"
        include_tags: "9*"
        exclude_tags: "*-source"

  - name: "OpenShift Container Platform 4.20"
    desc: "OCP 4.20 release and component container images"
    org: "{{ satellite_organization }}"
    label: "ocp-4-20"
    repositories:
      - name: "ocp-release"
        label: "ocp-release"
        description: "OCP 4.20 release images"
        docker_upstream_name: "openshift-release-dev/ocp-release"
        content_type: "docker"
        url: "https://quay.io"
        upstream_username: "{{ quay_registry_username_vault }}"
        upstream_password: "{{ quay_registry_password_vault }}"
        download_policy: "on_demand"
        include_tags: "{{ ocp_420_release_named_tags | join(',') }}"
        exclude_tags: "*-source"
      - name: "ocp-v4.0-art-dev"
        label: "ocp-v4_0-art-dev"
        description: "OCP 4.20 component images"
        docker_upstream_name: "openshift-release-dev/ocp-v4.0-art-dev"
        content_type: "docker"
        url: "https://quay.io"
        upstream_username: "{{ quay_registry_username_vault }}"
        upstream_password: "{{ quay_registry_password_vault }}"
        download_policy: "on_demand"
        include_tags: "{{ ocp_420_art_dev_named_tags | join(',') }}"
        exclude_tags: "*-source"

  - name: "OpenShift Container Platform 4.22"
    desc: "OCP 4.22 release and component container images"
    org: "{{ satellite_organization }}"
    label: "ocp-4-22"
    repositories:
      - name: "ocp-release"
        label: "ocp-release"
        description: "OCP 4.22 release images"
        docker_upstream_name: "openshift-release-dev/ocp-release"
        content_type: "docker"
        url: "https://quay.io"
        upstream_username: "{{ quay_registry_username_vault }}"
        upstream_password: "{{ quay_registry_password_vault }}"
        download_policy: "on_demand"
        include_tags: "{{ ocp_422_release_named_tags | join(',') }}"
        exclude_tags: "*-source"
      - name: "ocp-v4.0-art-dev"
        label: "ocp-v4_0-art-dev"
        description: "OCP 4.22 component images"
        docker_upstream_name: "openshift-release-dev/ocp-v4.0-art-dev"
        content_type: "docker"
