---
# Import any git repos into the base OS of the Satellite Server
# This is used primarily to sync and ingest Ansible Roles for:
# ansible role from compliance as code project / RedHatOfficial
#
# For disconnected (air-gapped) builds:
#   - satellite_roles_source_path points to the roles directory extracted from
#     the export bundle (e.g. /home/ansiblerunner/rhis_export/ansible_roles/)
#   - clone: false tells ansible.builtin.git to verify existing local repos
#     without reaching GitHub — roles are already present from the bundle sync
#   - The bundle must be extracted to satellite_roles_source_path before running

satellite_roles_source_path: "/home/ansiblerunner/rhis_export/ansible_roles"

# This really allows you to import any git repos that may contain content
# that you otherwise want to reference in your build

git_repos:
# RHEL9
  - repository: "https://github.com/RedHatOfficial/ansible-role-rhel9-e8.git"
    dest: "/etc/ansible/roles/ansible-role-rhel9-e8"
    clone: false
    force: true
  - repository: "https://github.com/RedHatOfficial/ansible-role-rhel9-ism.git"
