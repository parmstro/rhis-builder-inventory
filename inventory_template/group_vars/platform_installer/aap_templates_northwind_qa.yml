---

aap_job_templates_northwind_qa:
  - name: "NWQA1DeployServers"
    description: "Deploy Northwind multi-tier test machines to Qualification"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "create_hosts.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_satellite"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"
      enable_debug_logging: false
      host_build_comment: "Created by ansible for Northwind QA content test"
      deploy: true
      post_deploy_timeout: 600
      use_sync_build: false
      build_release_limit: 10
      satellite_organization: "{{ satellite_organization }}"
      satellite_location: "{{ satellite_location }}"
      satellite_validate_certs: true
      platform_hosts:
        - fqdn: "qatestnwdb2.{{ _runtime_global_domain_name }}"
          delete_host: false
          organization: "{{ satellite_organization }}"
          location: "{{ satellite_location }}"
          hostgroup: "hg_x86_64_rhel9_vm/qa/soe9_qa_northwind"
          activation_keys: "SOE9_qa_EPEL"
          lifecycle_environment: "Qualification"
          content_view: "SOE9"
          compute_resource: "VMware_Lab"
          compute_profile: "SOE_Medium"
          ptable: "Kickstart default"
          pxe_loader: "Grub2 UEFI"
          mac: "00:50:56:ff:ff:ff"
          comment: "rhis_test_host deleteme"
        - fqdn: "qatestnwcache2.{{ _runtime_global_domain_name }}"
          delete_host: false
          organization: "{{ satellite_organization }}"
          location: "{{ satellite_location }}"
          hostgroup: "hg_x86_64_rhel9_vm/qa/soe9_qa_northwind"
          activation_keys: "SOE9_qa_EPEL"
          lifecycle_environment: "Qualification"
          content_view: "SOE9"
          compute_resource: "VMware_Lab"
          compute_profile: "SOE_Medium"
          ptable: "Kickstart default"
          pxe_loader: "Grub2 UEFI"
          mac: "00:50:56:ff:ff:ff"
          comment: "rhis_test_host deleteme"
        - fqdn: "qatestnwapp2.{{ _runtime_global_domain_name }}"
          delete_host: false
          organization: "{{ satellite_organization }}"
          location: "{{ satellite_location }}"
          hostgroup: "hg_x86_64_rhel9_vm/qa/soe9_qa_northwind"
          activation_keys: "SOE9_qa_EPEL"
          lifecycle_environment: "Qualification"
          content_view: "SOE9"
          compute_resource: "VMware_Lab"
          compute_profile: "SOE_Medium"
          ptable: "Kickstart default"
          pxe_loader: "Grub2 UEFI"
          mac: "00:50:56:ff:ff:ff"
          comment: "rhis_test_host deleteme"
        - fqdn: "qatestnwlb2.{{ _runtime_global_domain_name }}"
          delete_host: false
          organization: "{{ satellite_organization }}"
          location: "{{ satellite_location }}"
          hostgroup: "hg_x86_64_rhel9_vm/qa/soe9_qa_northwind"
          activation_keys: "SOE9_qa_EPEL"
          lifecycle_environment: "Qualification"
          content_view: "SOE9"
          compute_resource: "VMware_Lab"
          compute_profile: "SOE_Medium"
          ptable: "Kickstart default"
          pxe_loader: "Grub2 UEFI"
          mac: "00:50:56:ff:ff:ff"
          comment: "rhis_test_host deleteme"

  - name: "NWQA2SnapshotServers"
    description: "Snapshot Northwind multi-tier test machines in Qualification"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "vmware/vmw_create_snapshot.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_vmware1"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.12"
      datacenter_folder: "/{{ _runtime_global_domain_name }}/vm"
      vmware_validate_certs: false
      host_list:
        - name: qatestnwdb2.{{ _runtime_global_domain_name }}
          snap_name: qatestnwdb2.original
          snap_description: "Northwind QA DB base build - delete me"
          quiesce: true
        - name: qatestnwcache2.{{ _runtime_global_domain_name }}
          snap_name: qatestnwcache2.original
          snap_description: "Northwind QA Cache base build - delete me"
          quiesce: true
        - name: qatestnwapp2.{{ _runtime_global_domain_name }}
          snap_name: qatestnwapp2.original
          snap_description: "Northwind QA App base build - delete me"
          quiesce: true
        - name: qatestnwlb2.{{ _runtime_global_domain_name }}
          snap_name: qatestnwlb2.original
          snap_description: "Northwind QA LB base build - delete me"
          quiesce: true

  - name: "NWQA3.1BuildQADB"
    description: "QA Build Northwind PostgreSQL database tier"
    job_type: "run"
    organization: "Default"
    inventory: "SOE_northwind_qa_pipeline_inventory"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "testcontent/Northwind/build_postgresql.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_northwind"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"

  - name: "NWQA3.2BuildQACache"
    description: "QA Build Northwind Redis cache tier"
    job_type: "run"
    organization: "Default"
    inventory: "SOE_northwind_qa_pipeline_inventory"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "testcontent/Northwind/build_redis.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_northwind"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"

  - name: "NWQA3.3BuildQAApp"
    description: "QA Build Northwind Django application tier"
    job_type: "run"
    organization: "Default"
    inventory: "SOE_northwind_qa_pipeline_inventory"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "testcontent/Northwind/build_django.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_northwind"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"

  - name: "NWQA3.4BuildQALB"
    description: "QA Build Northwind HAProxy load balancer tier"
    job_type: "run"
    organization: "Default"
    inventory: "SOE_northwind_qa_pipeline_inventory"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "testcontent/Northwind/build_haproxy.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_northwind"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"

  - name: "NWQA3.5TestQADeployment"
    description: "QA Test Northwind deployment - validate each tier and connection point"
    job_type: "run"
    organization: "Default"
    inventory: "SOE_northwind_qa_pipeline_inventory"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "testcontent/Northwind/qa_test.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_northwind"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"

  - name: "NWQA4PromoteToProd"
    description: "Promote the SOE Content for Northwind to Production"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "promote_only.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_satellite"
    variables:
      force_promote_all: true
      enable_debug_logging: false
      description: "Promoted by rhis-builder-pipelines"
      satellite_organization: "{{ satellite_organization }}"
      satellite_location: "{{ satellite_location }}"
      satellite_validate_certs: true
      source_lce: "Qualification"
      target_lce: "Production"
      content_views:
        - name: "SOE9"
      composite_content_views:
        - name: "SOE9_EPEL"

  - name: "NWQA5DeleteSnapshots"
    description: "Delete Northwind QA test machine snapshots"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "vmware/vmw_delete_snapshot.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_vmware1"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.12"
      datacenter_folder: "/{{ _runtime_global_domain_name }}/vm"
      vmware_validate_certs: false
      host_list:
        - name: qatestnwdb2.{{ _runtime_global_domain_name }}
          snap_name: qatestnwdb2.original
          snap_description: "Northwind QA DB base build - delete me"
          quiesce: true
        - name: qatestnwcache2.{{ _runtime_global_domain_name }}
          snap_name: qatestnwcache2.original
          snap_description: "Northwind QA Cache base build - delete me"
          quiesce: true
        - name: qatestnwapp2.{{ _runtime_global_domain_name }}
          snap_name: qatestnwapp2.original
          snap_description: "Northwind QA App base build - delete me"
          quiesce: true
        - name: qatestnwlb2.{{ _runtime_global_domain_name }}
          snap_name: qatestnwlb2.original
          snap_description: "Northwind QA LB base build - delete me"
          quiesce: true

  - name: "NWQA6FPowerOffServers"
    description: "PowerOff Northwind test machines in Qualification"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "vmware/vmw_power_off_vm.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_vmware1"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.12"
      datacenter_folder: "/{{ _runtime_global_domain_name }}/vm"
      vmware_validate_certs: false
      host_list:
        - name: qatestnwdb2.{{ _runtime_global_domain_name }}
        - name: qatestnwcache2.{{ _runtime_global_domain_name }}
        - name: qatestnwapp2.{{ _runtime_global_domain_name }}
        - name: qatestnwlb2.{{ _runtime_global_domain_name }}

  - name: "NWQA6SDeleteServers"
    description: "After approval, delete Northwind test machines in Qualification"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "delete_hosts.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_satellite"
    variables:
      enable_debug_logging: false
      satellite_organization: "{{ satellite_organization }}"
      satellite_location: "{{ satellite_location }}"
      satellite_validate_certs: true
      host_list:
        - name: qatestnwdb2.{{ _runtime_global_domain_name }}
        - name: qatestnwcache2.{{ _runtime_global_domain_name }}
        - name: qatestnwapp2.{{ _runtime_global_domain_name }}
        - name: qatestnwlb2.{{ _runtime_global_domain_name }}

