      - "rhis_{{ _runtime_global_domain_name }}_northwind"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"

  - name: "NWDev5.3BuildApp"
    description: "Build Northwind Django application tier"
    job_type: "run"
    organization: "Default"
    inventory: "SOE_northwind_pipeline_inventory"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "testcontent/Northwind/build_django.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
