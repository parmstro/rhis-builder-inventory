    variables:
      enable_debug_logging: false
      satellite_organization: "{{ satellite_organization }}"
      satellite_location: "{{ satellite_location }}"
      satellite_validate_certs: true
      host_list:
        - name: testnwdb2.{{ _runtime_global_domain_name }}
        - name: testnwcache2.{{ _runtime_global_domain_name }}
        - name: testnwapp2.{{ _runtime_global_domain_name }}
        - name: testnwlb2.{{ _runtime_global_domain_name }}

