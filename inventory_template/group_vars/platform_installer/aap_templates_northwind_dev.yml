---

aap_job_templates_northwind_dev:
  - name: "NWDev1PublishContent"
    description: "Publish the SOE Content for Northwind multi-tier application"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "publish_only.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_satellite"
    variables:
      force_publish_all: false
      skip_publish_all: false
      enable_debug_logging: false
      description: !unsafe "Errata updated on or before - {{ filter_enddate | default(ansible_date_time.date) }} - published by rhis-builder-pipelines"
      satellite_organization: "{{ satellite_organization }}"
      satellite_location: "{{ satellite_location }}"
      satellite_validate_certs: true
      content_views:
        - name: "EPEL9"
          date_filter_name: "Include_Errata_By_Date"
          publication_threshold_hours: 24
          force_publish: false
        - name: "SOE9"
          date_filter_name: "Include_Errata_By_Date"
          publication_threshold_hours: 24
          force_publish: false
      composite_content_views:
        - name: "SOE9_EPEL"
          publication_threshold_hours: 24
          force_publish: false

  - name: "NWDev2PromoteToDev"
    description: "Promote the SOE Content for Northwind to Development"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "promote_only.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_satellite"
    variables:
      force_promote_all: true
      enable_debug_logging: false
      description: !unsafe "Promoted by rhis-builder-pipelines on - {{ ansible_date_time.date }}"
      satellite_organization: "{{ satellite_organization }}"
      satellite_location: "{{ satellite_location }}"
      satellite_validate_certs: true
      source_lce: "Library"
      target_lce: "Development"
      content_views:
        - name: "SOE9"
      composite_content_views:
        - name: "SOE9_EPEL"

  - name: "NWDev3DeployServers"
    description: "Deploy Northwind multi-tier test machines to Development"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "create_hosts.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_satellite"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"
      enable_debug_logging: false
      host_build_comment: "Created by ansible for Northwind content test"
      deploy: true
      post_deploy_timeout: 600
      use_sync_build: false
      build_release_limit: 10
      satellite_organization: "{{ satellite_organization }}"
      satellite_location: "{{ satellite_location }}"
      satellite_validate_certs: true
      platform_hosts:
        - fqdn: "testnwdb2.{{ _runtime_global_domain_name }}"
          delete_host: false
          organization: "{{ satellite_organization }}"
          location: "{{ satellite_location }}"
          hostgroup: "hg_x86_64_rhel9_vm/dev/soe9_dev_northwind"
          activation_keys: "SOE9_dev_EPEL"
          lifecycle_environment: "Development"
          content_view: "SOE9"
          compute_resource: "VMware_Lab"
          compute_profile: "SOE_Medium"
          ptable: "Kickstart default"
          pxe_loader: "Grub2 UEFI"
          mac: "00:50:56:ff:ff:ff"
          comment: "rhis_test_host deleteme"
        - fqdn: "testnwcache2.{{ _runtime_global_domain_name }}"
          delete_host: false
          organization: "{{ satellite_organization }}"
          location: "{{ satellite_location }}"
          hostgroup: "hg_x86_64_rhel9_vm/dev/soe9_dev_northwind"
          activation_keys: "SOE9_dev_EPEL"
          lifecycle_environment: "Development"
          content_view: "SOE9"
          compute_resource: "VMware_Lab"
          compute_profile: "SOE_Medium"
          ptable: "Kickstart default"
          pxe_loader: "Grub2 UEFI"
          mac: "00:50:56:ff:ff:ff"
          comment: "rhis_test_host deleteme"
        - fqdn: "testnwapp2.{{ _runtime_global_domain_name }}"
          delete_host: false
          organization: "{{ satellite_organization }}"
          location: "{{ satellite_location }}"
          hostgroup: "hg_x86_64_rhel9_vm/dev/soe9_dev_northwind"
          activation_keys: "SOE9_dev_EPEL"
          lifecycle_environment: "Development"
          content_view: "SOE9"
          compute_resource: "VMware_Lab"
          compute_profile: "SOE_Medium"
          ptable: "Kickstart default"
          pxe_loader: "Grub2 UEFI"
          mac: "00:50:56:ff:ff:ff"
          comment: "rhis_test_host deleteme"
        - fqdn: "testnwlb2.{{ _runtime_global_domain_name }}"
          delete_host: false
          organization: "{{ satellite_organization }}"
          location: "{{ satellite_location }}"
          hostgroup: "hg_x86_64_rhel9_vm/dev/soe9_dev_northwind"
          activation_keys: "SOE9_dev_EPEL"
          lifecycle_environment: "Development"
          content_view: "SOE9"
          compute_resource: "VMware_Lab"
          compute_profile: "SOE_Medium"
          ptable: "Kickstart default"
          pxe_loader: "Grub2 UEFI"
          mac: "00:50:56:ff:ff:ff"
          comment: "rhis_test_host deleteme"

  - name: "NWDev4SnapshotServers"
    description: "Snapshot Northwind multi-tier test machines in Development"
    job_type: "run"
    organization: "Default"
    inventory: "TheProvisioner"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "vmware/vmw_create_snapshot.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_vmware1"
    variables:
      datacenter_folder: "/parmstrong.ca/vm"
      vmware_validate_certs: false
      host_list:
        - name: testnwdb2.{{ _runtime_global_domain_name }}
          snap_name: testnwdb2.original
          snap_description: "Northwind DB base build - delete me"
          quiesce: true
        - name: testnwcache2.{{ _runtime_global_domain_name }}
          snap_name: testnwcache2.original
          snap_description: "Northwind Cache base build - delete me"
          quiesce: true
        - name: testnwapp2.{{ _runtime_global_domain_name }}
          snap_name: testnwapp2.original
          snap_description: "Northwind App base build - delete me"
          quiesce: true
        - name: testnwlb2.{{ _runtime_global_domain_name }}
          snap_name: testnwlb2.original
          snap_description: "Northwind LB base build - delete me"
          quiesce: true

  - name: "NWDev5.1BuildDB"
