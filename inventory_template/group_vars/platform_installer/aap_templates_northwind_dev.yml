    playbook: "vmware/vmw_delete_snapshot.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_vmware1"
    variables:
      datacenter_folder: "/parmstrong.ca/vm"
      vmware_validate_certs: false
      host_list:
        - name: testnwdb2.{{ _runtime_global_domain_name }}
          snap_name: testnwdb2.original
