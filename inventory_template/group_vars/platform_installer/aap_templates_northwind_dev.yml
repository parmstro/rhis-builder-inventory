    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"

  - name: "NWDev5.4BuildLB"
    description: "Build Northwind HAProxy load balancer tier"
    job_type: "run"
    organization: "Default"
    inventory: "SOE_northwind_pipeline_inventory"
    project: "rhis-builder-pipelines"
    execution_environment: "satellite_ee_9"
    playbook: "testcontent/Northwind/build_haproxy.yml"
    become_enabled: true
    credentials:
      - "idm_machine"
      - "default_vault"
      - "rhis_{{ _runtime_global_domain_name }}_northwind"
    variables:
      ansible_python_interpreter: "/usr/bin/python3.9"

  - name: "NWDev5.5TestDeployment"
    description: "Test Northwind deployment - validate each tier and connection point"
    job_type: "run"
    organization: "Default"
    inventory: "SOE_northwind_pipeline_inventory"
    project: "rhis-builder-pipelines"
