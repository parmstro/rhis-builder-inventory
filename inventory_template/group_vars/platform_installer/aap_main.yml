---

# vars file for rhis_post
satellite_url: "https://{{ groups['sat_primary'][0] }}"

rhis_default_git_dest: "~/rhis_ee_repos"
redhat_container_registry_url: "registry.redhat.io"
redhat_registry_username: "{{ redhat_registry_username_vault }}"
redhat_registry_password: "{{ redhat_registry_password_vault }}"
redhat_automation_hub_token: "{{ redhat_automation_hub_token_vault }}"
redhat_automation_hub_token_refresh_cmd: "{{ redhat_automation_hub_token_refresh_cmd_vault }}"
private_hub_token: "{{ private_automation_hub_token_vault }}"
# AAP 2.5+ gateway proxies /api/galaxy/ to the hub pulp backend
private_hub_url: "https://{{ aap_gateway_host }}/api/galaxy/"
# AAP 2.5+ requires all API calls to route through the gateway
aap_gateway_host: "{{ groups['aap_gateways'][0] }}"
aap_platform_username: "{{ aap_admin_username_vault }}"
aap_platform_password: "{{ aap_admin_password_vault }}"

# AAP Authentication
aap_ldap_domain_map: "{{ _runtime_global_domain_name.split('.') | map('regex_replace', '^(.*)$', 'dc=\\1') | join(',') }}"
aap_admin_username: "{{ aap_admin_username_vault }}"
aap_admin_password: "{{ aap_admin_password_vault }}"

aap_validate_certs: false
aap_hub_validate_certs: false
ah_container_token: ""

satellite_ansible_callback_config_key: "{{ satellite_ansible_callback_config_key_vault }}"
cleanup_installer_keys: false

...
