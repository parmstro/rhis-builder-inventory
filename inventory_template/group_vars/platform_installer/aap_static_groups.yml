---

aap_static_groups:
# SOE Dev testing inventory static groups
  - name: "JBoss"
    description: "Main group for JBoss test servers"
    hosts:
      - "testjboss2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_pipeline_inventory"
    state: present

  - name: "LAMP"
    description: "Main group for LAMP stack test servers"
    hosts:
      - "testlamp2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_pipeline_inventory"
    state: present

  - name: "dbservers"
    description: "Installer group for database servers in LAMP stack test"
    hosts:
      - "testlamp2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_pipeline_inventory"
    state: present

  - name: "webservers"
    description: "Installer group for web servers in LAMP stack test"
    hosts:
      - "testlamp2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_pipeline_inventory"
    state: present

  - name: "WordPress"
    description: "Main group for WordPress servers"
    hosts:
      - "testwordpress2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_pipeline_inventory"
    state: present

  - name: "wordpressserver"
    description: "Installer group for WordPress servers"
    hosts:
      - "testwordpress2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_pipeline_inventory"
    state: present

# Northwind Dev testing inventory static groups
  - name: "Northwind"
    description: "Parent group for all Northwind multi-tier app test servers"
    hosts:
      - "testnwdb2.{{ _runtime_global_domain_name }}"
      - "testnwcache2.{{ _runtime_global_domain_name }}"
      - "testnwapp2.{{ _runtime_global_domain_name }}"
      - "testnwlb2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_northwind_pipeline_inventory"
    state: present

  - name: "nw_dbservers"
    description: "Northwind PostgreSQL database servers"
    hosts:
      - "testnwdb2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_northwind_pipeline_inventory"
    state: present

  - name: "nw_cacheservers"
    description: "Northwind Redis cache servers"
    hosts:
      - "testnwcache2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_northwind_pipeline_inventory"
    state: present

  - name: "nw_appservers"
    description: "Northwind Django application servers"
    hosts:
      - "testnwapp2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_northwind_pipeline_inventory"
    state: present

  - name: "nw_lbservers"
    description: "Northwind HAProxy load balancer servers"
    hosts:
      - "testnwlb2.{{ _runtime_global_domain_name }}"
    inventory: "SOE_northwind_pipeline_inventory"
    state: present

  - name: "controller"
    description: "The automation controller"
    hosts:
      - "{{ groups['aap_controllers'][0] }}"
    inventory: "TheAutomationController"
    state: present

  - name: "provisioner"
    description: "An alias for the automation controller"
    hosts:
      - "{{ groups['aap_controllers'][0] }}"
    inventory: "TheProvisioner"
    state: present

# c2r demo pipeline static groups
  - name: "centos"
    description: "Main group for centos test servers"
    hosts:
      - "centosdemo1.{{ _runtime_global_domain_name }}"
      - "centosdemo2.{{ _runtime_global_domain_name }}"
    inventory: "convert2rhel_pipeline_inventory"
    state: present

  - name: "oel"
    description: "Main group for centos test servers"
    hosts:
      - "oeldemo1.{{ _runtime_global_domain_name }}"
      - "oeldemo2.{{ _runtime_global_domain_name }}"
    inventory: "convert2rhel_pipeline_inventory"
    state: present

  - name: "cconvert2rhel"
    description: "Main group for convert2rhel test servers"
    hosts:
      - "centosdemo1.{{ _runtime_global_domain_name }}"
      - "centosdemo2.{{ _runtime_global_domain_name }}"
      - "oeldemo1.{{ _runtime_global_domain_name }}"
      - "oeldemo2.{{ _runtime_global_domain_name }}"
    inventory: "convert2rhel_pipeline_inventory"
    state: present

